display_information:
  name: Think Tree Brand Agent
  description: RAG-powered brand intelligence inside Slack
  background_color: "#111111"
features:
  bot_user:
    display_name: Brand Agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - im:history
      - mpim:history
settings:
  event_subscriptions:
    request_url: https://YOUR-DEPLOYMENT.vercel.app/api/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
